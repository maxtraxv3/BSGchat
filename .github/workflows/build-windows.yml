name: Build Windows Executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build relay server
        run: pyinstaller --clean --noconfirm --onefile --name asciline-relay --console --hidden-import shared --hidden-import shared.protocol --hidden-import shared.crypto --hidden-import shared.upnp --hidden-import miniupnpc --exclude-module tkinter --exclude-module PIL --exclude-module cv2 --exclude-module numpy --exclude-module sounddevice --exclude-module mss server\relay.py

      - name: Build GUI client
        run: pyinstaller --clean --noconfirm --onefile --name asciline-client --windowed --hidden-import client --hidden-import client.gui --hidden-import client.main --hidden-import client.audio_io --hidden-import client.video_io --hidden-import client.screencap --hidden-import client.web_viewer --hidden-import shared --hidden-import shared.protocol --hidden-import shared.crypto --hidden-import shared.asciline --hidden-import shared.adpcm --hidden-import shared.image_share --hidden-import shared.file_share --hidden-import shared.upnp --hidden-import miniupnpc --hidden-import sounddevice --hidden-import numpy --hidden-import cv2 --hidden-import PIL --hidden-import mss client\main.py

      - name: Upload relay
        uses: actions/upload-artifact@v4
        with:
          name: asciline-relay-windows
          path: dist/asciline-relay.exe

      - name: Upload client
        uses: actions/upload-artifact@v4
        with:
          name: asciline-client-windows
          path: dist/asciline-client.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/asciline-relay.exe
            dist/asciline-client.exe
